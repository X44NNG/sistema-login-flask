<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
    <script src="https://www.google.com/recaptcha/api.js?hl=es" async defer></script>
    
</head>
<body>

<div class="container">

<form method="POST" class="box">

    <h2>Iniciar Sesión</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <input type="text"
           name="username"
           placeholder="Usuario"
           required>

    <input type="password"
           name="password"
           placeholder="Contraseña"
           required>

    <div class="g-recaptcha"
    data-sitekey="{{ site_key }}">
    </div>

    <button type="submit">
        Entrar
    </button>

    <a href="/register">Crear usuario</a>

    <a href="/recover">Recuperar contraseña</a>

</form>

</div>

</body>
</html>
