<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

<form method="POST" class="box">

    <h2>Recuperar Contraseña</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <input type="text"
           name="username"
           placeholder="Usuario"
           required>

    <button type="submit">
        Continuar
    </button>

    <a href="/">Volver</a>

</form>

</div>

</body>
</html>
